# Zensical config for the English site. Not used as is: docs/site-src.sh
# fills in the @...@ placeholders and drops lines marked "# private" (public
# build) or "# public" (private build). Zensical knows only one language per
# project, so English and German are two projects - English at the root,
# German under de/ - linked by the language selector (extra.alternate).
[project]
site_name = "nixlab"
site_description = "NixOS/OpenTofu homelab – project documentation"
site_url = "https://tioan.github.io/nixlab-docs/"
# Repository and "view source" button (content.action.view): public site ->
# its anonymised sources in nixlab-docs, private site -> the pages in the
# private repo. The two generated reference pages and the install guides
# have no file at that path - their button leads to a 404.
repo_url = "https://github.com/tioan/nixlab-docs" # public
repo_name = "nixlab-docs" # public
edit_uri = "blob/main/site/en/" # public
copyright = "Written together with Claude (Anthropic) · modules under the MIT license" # public
docs_dir = "en"
site_dir = "_site"
# Fonts and the lightbox from the site itself, not from Google or unpkg -
# docs/assets.nix. glightbox.min.js has to be there before the theme looks
# for GLightbox; then it never loads its own copy from unpkg.com.
# diagrams.css: dark scheme of the inline SVG diagrams (conventions page);
# diagrams.js: their boxes jump to sections of the page, a click elsewhere
# on one opens it enlarged (GLightbox, like an image).
extra_css = ["assets/stylesheets/fonts.css", "assets/stylesheets/diagrams.css", "assets/vendor/glightbox/glightbox.min.css"]
extra_javascript = ["assets/vendor/glightbox/glightbox.min.js", "assets/javascripts/diagrams.js"]
nav = [
  { "Home" = "index.md" },
  { "Explanation" = [
    "explanation/nixos-opentofu.md",
    "explanation/secrets-network-access.md",
    "explanation/deployment.md",
    "explanation/monitoring.md",
    "explanation/macos-hosts.md",
  ] },
  { "How-to guides" = [
    "how-to/new-host.md",
    "how-to/new-service.md",
    "how-to/secrets.md",
    "how-to/key-rotation.md",
  ] },
  { "Reference" = [
    "reference/repository.md",
    "reference/where-to-change.md",
    "reference/host-directory.md",
    "reference/inputs.md",
    "reference/hosts.md",
    "reference/gusto.md",
    "reference/inventory.md",
    "reference/inventory-schema.md",
    "reference/services.md",
    "reference/modules.md",
    "reference/modules-generated.md", # generated
    "reference/recipes.md",
    "reference/recipes-generated.md", # generated
    "reference/troubleshooting.md",
  ] },
  { "Project" = [
    "project/conventions.md",
    "project/open-items.md",
  ] },
]

[project.theme]
language = "en"
# Own fonts instead of Google Fonts (extra_css above).
font = false
features = [
  "content.action.view",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.alternate]]
name = "English"
link = "/nixlab-docs/"
lang = "en"

[[project.extra.alternate]]
name = "Deutsch"
link = "/nixlab-docs/de/"
lang = "de"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.keys = {}
pymdownx.inlinehilite = {}
# Code blocks: language as title, line numbers in their own column (not
# copied along), each line its own anchor and span.
pymdownx.highlight.pygments_lang_class = true
pymdownx.highlight.auto_title = true
pymdownx.highlight.linenums = true
pymdownx.highlight.linenums_style = "pymdownx-table"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
# Content tabs (=== "macOS" ...), linked across the page (content.tabs.link).
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true

# Click an image to see it full size (the data-flow diagram). The script
# and stylesheet come with the site (extra_javascript/extra_css above,
# docs/assets.nix) - the theme would otherwise fetch them from unpkg.com.
[project.plugins.glightbox]
enabled = true
