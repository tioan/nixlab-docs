# Builds the documentation site (Zensical) from site/ and publishes it on
# GitHub Pages: English at the root, German under /de/.
#
# Generated: this file comes from docs/public-workflow.yml in the private
# nixlab repo and is overwritten by every `just docs` there - change it
# there. Actions are pinned to commits, Zensical to the version in
# nixpkgs-unstable that builds the private copy of the site (it is still
# before 1.0, so config keys may change between versions).
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install zensical==0.0.62
      # English owns the root, so it is built first; German goes to _site/de.
      - run: zensical build --clean -f site/zensical.en.toml
      - run: zensical build --clean -f site/zensical.de.toml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
